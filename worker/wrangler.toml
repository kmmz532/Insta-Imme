name = "insta-imme-worker"
main = "src/index.ts"
compatibility_date = "2025-07-01"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "insta-imme-db"
database_id = "YOUR_D1_DATABASE_ID"

# R2 Bucket
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "insta-imme-images"

# KV Namespace
[[kv_namespaces]]
binding = "KV"
id = "YOUR_KV_NAMESPACE_ID"

# 秘密情報は .dev.vars で管理
# JWT_SECRET=
# INSTAGRAM_APP_ID=
# INSTAGRAM_APP_SECRET=
# FRONTEND_URL=http://localhost:5173
